name: Update Clements data from CSV

on:
  push:
    paths:
      - 'files/Clements_v2025-October-2025.csv'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate files/clements_data.js
        run: python scripts/generate_clements_data.py

      - name: Commit updated clements_data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/clements_data.js
          git diff --staged --quiet || git commit -m "Auto-update clements_data.js from CSV"
          git push
